<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Mirage VIP Logo</title>
  <desc id="desc">Cyberpunk styled Mirage VIP logo in purple tones.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12061f"/>
      <stop offset="55%" stop-color="#38105f"/>
      <stop offset="100%" stop-color="#9d3bff"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f8d4ff"/>
      <stop offset="100%" stop-color="#d666ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="92" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
  <path d="M44 184C72 142 97 121 128 121C159 121 184 142 212 184" fill="none" stroke="#ff7be6" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/>
  <path d="M50 72H206" stroke="#f3bbff" stroke-opacity=".35" stroke-width="6" stroke-linecap="round"/>
  <text x="128" y="118" text-anchor="middle" font-size="54" font-family="Georgia, 'Times New Roman', serif" fill="url(#text)" filter="url(#glow)">M</text>
  <text x="128" y="160" text-anchor="middle" font-size="38" font-family="Arial, Helvetica, sans-serif" letter-spacing="6" fill="#ffffff">VIP</text>
  <rect x="30" y="30" width="196" height="196" rx="34" fill="none" stroke="#f7d8ff" stroke-opacity=".22"/>
</svg>
